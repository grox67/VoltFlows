
name: Build VoltFlow APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoltFlow-Loki-Timeline-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir project
          unzip VoltFlow-Loki-Timeline-Android-Project.zip -d project

      - name: Fix animation code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/src/main/java/com/voltflow/app/ChargingActivity.kt")
          s = p.read_text()

          old = "val y = cy + sin(t * Math.PI * 2 + i) * (1f - t) * 115f"
          new = "val y = cy + sin(t * Math.PI * 2 + i).toFloat() * (1f - t) * 115f"

          if old not in s:
              raise SystemExit("Could not find animation line to fix")

          p.write_text(s.replace(old, new, 1))
          print("Animation code fixed!")

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                      kotlinOptions {
                          jvmTarget = "17"
                      }
                  """,
                  1
              )
              p.write_text(s)
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoltFlow-Loki-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
